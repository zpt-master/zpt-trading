[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zpt-intel"
version = "1.0.0"
description = "Risk-governed FX market intelligence + actionable macro brief"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZptMaster", email = "agent@zpt.local" }]
keywords = ["fx", "trading", "market-intelligence", "x402", "risk-management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://zpt-master.github.io/zpt-trading/"
Repository = "https://github.com/zpt-master/zpt-trading"

[project.scripts]
zpt-intel = "fxintel.cli:main"

[tool.setuptools]
packages = ["fxintel"]
